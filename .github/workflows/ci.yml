name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Personal data stays out of git
        run: |
          git check-ignore -q data/profile.json
          git check-ignore -q data/letters/x.json
          git check-ignore -q .env
          test -z "$(git ls-files data .env)"
